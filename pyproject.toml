[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mod-audit"
version = "0.2.0"
description = "Static supply-chain auditor for Claude Code Mods — local, offline, stdlib-only; update-diff risk reports"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "hao li"}]
keywords = ["claude-code", "mods", "supply-chain", "security", "static-analysis", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

[project.scripts]
mod-audit = "mod_audit.cli:main"

[project.urls]
Homepage = "https://github.com/hahahahahahahahah6/mod-audit"

[tool.setuptools.packages.find]
where = ["src"]
